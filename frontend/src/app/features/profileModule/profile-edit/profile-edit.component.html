<!-- Profile-Detail Component -->

<body class="d-flex flex-column min-vh-100 bg-light">

    <!-- TopAppBar -->
    <topAppBar />

    <!-- Page Content -->
    <main class="flex-grow-1 d-flex align-items-center justify-content-center py-5 bg-light">
        <div class="container">
            <!-- Card Wrapper -->
            <div class="card border-0 shadow-lg rounded-0">
                <!-- Header -->
                <div class="card-header bg-dark text-white rounded-0 py-3">
                    <h5 class="mb-0 fw-bold">
                        <i class="bi bi-pencil-square me-2"></i> Editar Perfil
                    </h5>
                </div>
                <!-- Body -->
                <div class="card-body bg-white p-3">
                    <form (ngSubmit)="onUpdateProfile()" autocomplete="on">

                        <!-- @name, @surname, @profession -->
                        <div class="row g-3 mb-3">
                            <div class="col-md-4">
                                <label for="name" class="bodyMedium">Nombre</label>
                                <input id="name" name="name" type="text" [(ngModel)]="profile.name"
                                    class="form-control rounded-0">
                            </div>
                            <div class="col-md-4">
                                <label for="surname" class="bodyMedium">Apellidos</label>
                                <input id="surname" name="surname" type="text" [(ngModel)]="profile.surname"
                                    class="form-control rounded-0">
                            </div>
                            <div class="col-md-4">
                                <label for="profession" class="bodyMedium">Profesión</label>
                                <input id="profession" name="profession" type="text" [(ngModel)]="profile.profession"
                                    class="form-control rounded-0">
                            </div>
                        </div>

                        <!-- @interests, @hobbies -> @about -->
                        <div class="row g-3 mb-3">
                            <div class="col-md-6">
                                <label for="interests" class="bodyMedium">Intereses</label>
                                <input id="interests" name="interests" type="text"
                                    [ngModel]="profile.interests.join(', ')" (ngModelChange)="updateInterests($event)"
                                    class="form-control rounded-0">
                                <small class="text-muted bodySmall">Separa tus intereses por comas (,).</small>
                            </div>
                            <div class="col-md-6">
                                <label for="hobbies" class="bodyMedium">Hobbies</label>
                                <input id="hobbies" name="hobbies" type="text" [ngModel]="profile.hobbies.join(', ')"
                                    (ngModelChange)="updateHobbies($event)" class="form-control rounded-0">
                                <small class="text-muted bodySmall">Separa tus hobbies por comas (,).</small>
                            </div>
                        </div>

                        <!-- @photo, @curriculumvitae -->
                        <div class="row g-3 mb-3">
                            <div class="col-md-6">
                                <label for="photo" class="bodyMedium">Foto de Perfil</label>
                                <input id="photo" type="file" accept="image/*" class="form-control rounded-0"
                                    (change)="onPhotoSelected($event)">
                                <small class="text-muted bodySmall">Formatos: JPG, PNG, GIF (máx. 2MB)</small>
                            </div>
                            <div class="col-md-6">
                                <label for="curriculumvitae" class="bodyMedium">Currículum Vitae</label>
                                <input id="curriculumvitae" type="file" accept="application/pdf"
                                    class="form-control rounded-0" (change)="onCVSelected($event)">
                                <div>
                                    <small class="text-muted me-2 bodySmall">Solo archivos PDF (máx. 2MB)</small>
                                    <small class="text-primary bodySmall"
                                        *ngIf="profile.curriculumvitae && !selectedCV">Ya tienes
                                        un CV cargado</small>
                                    <small class="text-success bodySmall" *ngIf="selectedCV">Nuevo CV cargado</small>
                                </div>
                            </div>
                        </div>

                        <!-- @visible -->
                        <div class="form-check form-switch mb-4">
                            <input id="visibleSwitch" name="visible" class="form-check-input" type="checkbox"
                                [(ngModel)]="profile.visible">
                            <label for="visibleSwitch" class="form-check-label ms-2 bodyMedium">
                                Mostrar mi perfil públicamente
                            </label>
                        </div>

                        <!-- Botones -->
                        <div class="d-flex justify-content-between mt-4">
                            <button type="button" class="btn btn-outline-dark rounded-0 px-4" (click)="goToProfile()">
                                <i class="bi bi-arrow-left me-2"></i> Regresar
                            </button>
                            <button type="submit" class="btn btn-primary rounded-0 px-4 fw-semibold"
                                [disabled]="loading || errorMessage">
                                <i class="bi bi-save me-2"></i>
                                {{ loading ? 'Guardando...' : 'Guardar' }}
                            </button>
                        </div>

                    </form>

                </div>
            </div>
        </div>
    </main>

    <!-- BottomAppBar -->
    <bottomAppBar [type]="errorMessage ? 'error' : successMessage ? 'success' : null"
        [message]="errorMessage || successMessage" />

</body>
