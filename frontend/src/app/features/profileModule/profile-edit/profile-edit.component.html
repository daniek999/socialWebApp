<!-- Profile-Detail Component -->

<body class="d-flex flex-column min-vh-100 bg-light">

    <!-- TopAppBar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container py-2">
            <!-- Brand -->
            <a class="navbar-brand fw-bold text-uppercase">Red Social</a>
        </div>
    </nav>

    <!-- Page Content -->
    <main class="flex-grow-1 d-flex align-items-center justify-content-center">
        <div class="container">
            <!-- Title Section -->
            <div class="d-flex align-items-center border-bottom border-dark mb-3 pb-2">
                <i class="bi bi-pencil-square fs-4 text-dark me-2"></i>
                <h5 class="mb-0 fw-bold text-dark">Editar Perfil</h5>
            </div>
            <!-- Form Section -->
            <form class="bg-white p-3" (ngSubmit)="onUpdateProfile()" *ngIf="!loading">
                <!-- @name, @surname, @profession -->
                <div class="row mb-3">
                    <div class="form-group col">
                        <label for="name" class="form-label">Nombre</label>
                        <input type="text" [(ngModel)]="profile.name" name="name" class="form-control rounded-0"
                            id="name">
                    </div>

                    <div class="form-group col">
                        <label for="surname" class="form-label">Apellidos</label>
                        <input type="text" [(ngModel)]="profile.surname" name="surname" class="form-control rounded-0"
                            id="surname">
                    </div>

                    <div class="form-group col">
                        <label for="profession" class="form-label">Profesión</label>
                        <input type="text" [(ngModel)]="profile.profession" name="profession"
                            class="form-control rounded-0" id="profession">
                    </div>
                </div>
                <!-- @interests, @hobbies -->
                <div class="row mb-3">
                    <div class="form-group col">
                        <label for="interests" class="form-label">Intereses</label>
                        <input type="text" [ngModel]="profile.interests.join(', ')"
                            (ngModelChange)="updateInterests($event)" name="interests" class="form-control rounded-0"
                            id="interests">
                        <small class="form-text text-muted">Separa tus Intereses entre 'comas'.</small>
                    </div>
                    <div class="form-group col">
                        <label for="hobbies" class="form-label">Hobbies</label>
                        <input type="text" [ngModel]="profile.hobbies.join(', ')"
                            (ngModelChange)="updateHobbies($event)" name="hobbies" class="form-control rounded-0"
                            id="hobbies">
                        <small class="form-text text-muted">Separa tus Hobbies entre 'comas'.</small>
                    </div>
                </div>
                <!-- @isVisible -->
                <div class="row mb-3">
                    <div class="form-group col d-flex align-items-center">
                    <div class="form-check form-switch">
                        <input
                        class="form-check-input"
                        type="checkbox"
                        id="visibleSwitch"
                        [(ngModel)]="profile.visible"
                        name="visible"
                        />
                        <label class="form-check-label ms-2" for="visibleSwitch">
                        Mostrar mi perfil públicamente
                        </label>
                    </div>
                    </div>
                </div>
                <!-- [ACTIONS] -->
                <div class="row">
                    <div class="col text-start">
                        <button type="button" class="btn btn-dark rounded-0" (click)="goToProfile()">
                            <i class="bi bi-arrow-left me-2"></i> Regresar
                        </button>
                    </div>
                    <div class="col text-end">
                        <button type="submit" class="btn btn-primary rounded-0">
                            <i class="bi bi-save me-2"></i> Actualizar Perfil
                        </button>
                    </div>
                </div>
            </form>
        </div>
    </main>


    <!-- BottomAppBar -->
    <footer class="bg-dark text-white text-center py-3 mt-auto">
        <div class="container">
            <p class="m-0 small">&copy; Red Social 2025 — Todos los derechos reservados</p>
        </div>
    </footer>


</body>
