<body class="d-flex flex-column min-vh-100">

    <!-- ================= HEADER ================= -->
    <app-TopBar />

    <!-- ================== MAIN ================== -->
    <main class="content-wrapper d-flex">
        <!-- View Navigation -->
        <navigationBar class="bg-white nav-panel border-end border-subtle-dark" />
        <!-- View Content -->
        <div class="bg-custom-background d-flex flex-column flex-grow-1 overflow-y-auto py-3 px-5">
            <!-- Title -->
            <div class="d-flex align-items-center justify-content-start px-0">
                <div class="bg-dark text-white d-flex justify-content-center align-items-center me-2 rounded-circle"
                    style="width: 40px; height: 40px;">
                    <i class="bi bi-globe-americas fs-5"></i>
                </div>
                <p class="bodyLarge m-0 fw-bold text-dark">Comunidad</p>
            </div>
            <!-- Content -->
            <div class="d-flex flex-column flex-grow-1 mt-3">
                <!-- [Loading] -->
                <div *ngIf="isLoadingProfilesData()" class="text-center py-4 m-auto">
                    <div class="spinner-border text-primary"></div>
                    <p class="small text-muted mt-2 mb-0">Cargando perfiles...</p>
                </div>
                <!-- [Filled] -->
                <div *ngIf="!isLoadingProfilesData()">
                    <div class="d-flex flex-column gap-3">
                        <div *ngFor="let profile of profiles"
                            class="bg-white d-flex align-items-center gap-3 rounded-2 p-3">
                            <!-- FOTO -->
                            <img [src]="getPhotoUrl(profile)" width="100" height="100" class="rounded-circle border"
                                style="object-fit: cover;" />
                            <!-- INFO -->
                            <div class="flex-grow-1">
                                <div class="bodySmall d-flex flex-wrap text-primary">
                                    <span><i class="bi bi-at me-1"></i>{{ profile.idUser.username }}</span>
                                </div>
                                <p class="bodyLarge fw-bold  mb-3">
                                    {{ profile.name + ' ' + profile.surname }}
                                </p>
                                <div class="bodySmall d-flex flex-wrap gap-2 text-secondary">
                                    <span><i class="bi bi-briefcase-fill me-1"></i>{{ profile.profession || 'Sin profesión' }}</span>
                                    <span><i class="bi bi-person-arms-up me-1"></i>{{ profile.employmentStatus}}</span>
                                </div>
                            </div>
                            <!-- BOTONES -->
                            <div class="d-flex flex-column gap-2">
                                <button class="bodySmall btn btn-outline-dark btn-sm rounded-2"
                                    (click)="sendFriendRequest(profile.idUser._id)">
                                    <i class="bi bi-person-plus me-1"></i>
                                    Agregar
                                </button>
                                <button class="bodySmall btn btn-outline-primary btn-sm rounded-2"
                                    (click)="goToSelectedProfile(profile.idUser._id)">
                                    <i class="bi bi-eye me-1"></i>
                                    Ver Perfil
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
                <!-- [Empty] -->
                <div *ngIf="isProfilesListEmpty()"
                    class="p-3 d-flex flex-column justify-content-center align-items-center rounded-0">
                    <i class="bi bi-emoji-neutral text-dark fs-2 m-0"></i>
                    <p class="bodyMedium fw-semibold m-0">No hay perfiles públicos.</p>
                    <p class="bodySmall text-muted m-0">Vamos, no sean tímidos y compartan su perfil con los demás.</p>
                </div>
            </div>
        </div>
    </main>

    <!-- ================= FOOTER ================= -->
    <app-BottomBar [type]="errorMessage ? 'error' : successMessage ? 'success' : null"
        [message]="errorMessage || successMessage" />

</body>
