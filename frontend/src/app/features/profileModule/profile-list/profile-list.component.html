<!-- Profile-List Component -->

<body class="d-flex flex-column min-vh-100 bg-light">

    <!-- TopAppBar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container py-2">
            <!-- Brand -->
            <a class="navbar-brand fw-bold text-uppercase">Red Social</a>
            <!-- Links -->
            <div class="collapse navbar-collapse justify-content-end" id="navbarSupportedContent">
                <ul class="navbar-nav d-flex align-items-center gap-2">
                    <li class="nav-item">
                        <button class="btn btn-outline-light rounded-0 border-0" (click)="goToHome()">
                            <i class="bi bi-house-door-fill"></i> Home
                        </button>
                    </li>
                    <li class="nav-item">
                        <button class="btn btn-outline-light rounded-0 border-0" (click)="goToProfile()">
                            <i class="bi bi-person-fill"></i> Perfil
                        </button>
                    </li>
                    <li class="nav-item">
                        <button class="btn btn-outline-light rounded-0 border-0" (click)="goToCommunity()">
                            <i class="bi bi-people-fill"></i> Comunidad
                        </button>
                    </li>
                    <li class="nav-item">
                        <button class="btn btn-outline-danger rounded-0 border-0" (click)="logout()">
                            <i class="bi bi-box-arrow-right me-2"></i> LogOut
                        </button>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Page Content -->
    <main class="flex-grow-1 d-flex align-items-center justify-content-center">
        <div class="container" style="height: 85vh;">
            <div class="h-100 d-flex flex-column">
                <!-- Title Section -->
                <div class="d-flex align-items-center border-bottom border-dark mb-3 pb-2 flex-shrink-0">
                    <i class="bi bi-people-fill fs-4 text-dark me-2"></i>
                    <h5 class="mb-0 fw-bold text-dark">Comunidad</h5>
                </div>
                <!-- Content Section -->
                <div class="flex-grow-1 overflow-auto pe-2" style="max-height: calc(85vh - 70px);">
                    <!-- IF -->
                    <div *ngIf="profiles && profiles.length > 0; else noProfiles">
                        <div class="d-flex flex-column gap-4">
                            <div *ngFor="let profile of profiles" class="card border-0 rounded-0 shadow-sm">
                                <div class="card-body p-3">
                                    <!-- Cabecera -->
                                    <div class="d-flex justify-content-between align-items-center mb-2">
                                        <div>
                                            <h5 class="card-title fw-bold mb-1 text-primary">
                                                {{ profile.idUser.username }}
                                            </h5>
                                            <p class="text-muted small mb-0">
                                                <i class="bi bi-person-badge me-1"></i>
                                                {{ profile.profession || 'Sin profesión' }}
                                            </p>
                                        </div>
                                    </div>
                                    <!-- Contenido -->
                                    <div class="mb-2">
                                        <p class="mb-1">
                                            <strong>Intereses:</strong>
                                            <span *ngIf="profile.interests">
                                                {{ profile.interests.join(', ') }}
                                            </span>
                                        </p>
                                        <p class="mb-1">
                                            <strong>Hobbies:</strong>
                                            <span *ngIf="profile.hobbies">
                                                {{ profile.hobbies.join(', ') }}
                                            </span>
                                        </p>
                                    </div>
                                    <!-- Acciones -->
                                    <div class="text-end">
                                        <button class="btn btn-outline-primary btn-sm rounded-0" (click)="goToSelectedProfile(profile.idUser._id)">
                                            <i class="bi bi-eye me-1"></i> Ver Perfil Completo
                                        </button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                    <!-- ELSE -->
                    <ng-template #noProfiles>
                        <div class="alert alert-secondary rounded-0 text-center fw-semibold">
                            <i class="bi bi-exclamation-circle me-1"></i> Cargando Perfiles.
                        </div>
                    </ng-template>
                </div>
            </div>
        </div>
    </main>



    <!-- BottomAppBar -->
    <footer class="bg-dark text-white text-center py-3 mt-auto">
        <div class="container">
            <p class="m-0 small">&copy; Red Social 2025 — Todos los derechos reservados</p>
        </div>
    </footer>

</body>
