<!-- Home Component -->
<body class="d-flex flex-column min-vh-100 bg-light">

    <!-- TopAppBar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container py-2">
            <!-- Brand -->
            <a class="navbar-brand fw-bold text-uppercase">Red Social</a>
            <!-- Links -->
            <div class="collapse navbar-collapse justify-content-end" id="navbarSupportedContent">
                <ul class="navbar-nav d-flex align-items-center gap-2">
                    <li class="nav-item">
                        <button class="btn btn-outline-light rounded-0 border-0 px-3" (click)="goToHome()">
                            <i class="bi bi-house-door-fill"></i> Home
                        </button>
                    </li>
                    <li class="nav-item">
                        <button class="btn btn-outline-light rounded-0 border-0 px-3" (click)="goToProfile()">
                            <i class="bi bi-person-fill"></i> Perfil
                        </button>
                    </li>
                    <li class="nav-item">
                        <button class="btn btn-outline-light rounded-0 border-0 px-3">
                            <i class="bi bi-people-fill"></i> Amigos
                        </button>
                    </li>
                    <li class="nav-item">
                        <button class="btn btn-danger rounded-0 border-0 px-3" (click)="logout()">
                            <i class="bi bi-box-arrow-right me-2"></i> LogOut
                        </button>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Page Content -->
    <main class="flex-grow-1 d-flex align-items-center justify-content-center">
        <div class="container">
            <div class="row" style="height: calc(100vh - 160px);">
                <!-- Left Column: Form -->
                <div class="col-lg-4">
                    <!-- Title Section -->
                    <div class="d-flex align-items-center border-bottom border-dark mb-3 pb-2">
                        <i class="bi bi-pencil-square fs-4 text-dark me-2"></i>
                        <h5 class="mb-0 fw-bold text-dark">Crear Nuevo Post</h5>
                    </div>
                    <!-- Content Secion -->
                    <div class="card border-0 rounded-0">
                        <div class="card-body d-flex flex-column justify-content-between">
                            <form class="flex-grow-1 d-flex flex-column">
                                <!-- @title -->
                                <div class="mb-3">
                                    <label class="form-label fw-semibold">Título</label>
                                    <input type="text" class="form-control rounded-0 border-dark" name="title"
                                        placeholder="Ej. Mi nuevo proyecto" required />
                                </div>

                                <!-- @content -->
                                <div class="mb-3 flex-grow-1">
                                    <label class="form-label fw-semibold">Contenido</label>
                                    <textarea class="form-control rounded-0 h-100 border-dark" rows="5" name="content"
                                        placeholder="¿Qué estás pensando?" required></textarea>
                                </div>

                                <!-- [Action] -->
                                <button type="submit" class="btn bg-dark rounded-0 w-100 fw-bold text-light">
                                    <i class="bi bi-send-fill me-1"></i> Publicar
                                </button>
                            </form>
                        </div>
                    </div>
                </div>
                <!-- Right Column: Posts -->
                <div class="col-lg-8 h-100 d-flex flex-column">
                    <!-- Title Section -->
                    <div class="d-flex align-items-center border-bottom border-dark mb-3 pb-2 flex-shrink-0">
                        <i class="bi bi-collection fs-4 text-dark me-2"></i>
                        <h5 class="mb-0 fw-bold text-dark">Publicaciones</h5>
                    </div>
                    <!-- Content Section -->
                    <div class="flex-grow-1 overflow-auto">
                        <!-- IF -->
                        <div *ngIf="posts && posts.length > 0; else noPosts">
                            <div class="d-flex flex-column gap-4">
                                <div *ngFor="let post of posts" class="card border-0 rounded-0">
                                    <div class="card-body p-3">
                                        <div class="d-flex justify-content-between align-items-center mb-2">
                                            <span class="text-muted small">
                                                {{ post.createdAt | date:'mediumDate' }}
                                            </span>
                                        </div>
                                        <h5 class="card-title fw-bold mb-2">{{ post.title }}</h5>
                                        <p class="card-text text-muted mb-0">
                                            <span class="text-primary fw-semibold">
                                                {{ post.idUser.username }}:
                                            </span>
                                            {{ post.content }}
                                        </p>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <!-- ELSE -->
                        <ng-template #noPosts>
                            <div class="alert alert-secondary rounded-0 text-center fw-semibold">
                                <i class="bi bi-exclamation-circle me-1"></i> Cargando publicaciones.
                            </div>
                        </ng-template>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- BottomAppBar -->
    <footer class="bg-dark text-white text-center py-3 mt-auto">
        <div class="container">
            <p class="m-0 small">&copy; Red Social 2025 — Todos los derechos reservados</p>
        </div>
    </footer>

    <!-- Error -->
    <p *ngIf="errorMessage" class="text-danger text-center mt-4 fw-bold">
        {{ errorMessage }}
    </p>

</body>
