<!-- Home Component -->
<body class="d-flex flex-column min-vh-100 bg-light">

    <!-- HEADER -->
    <topAppBar />

    <!-- MAIN -->
    <main class="flex-grow-1 d-flex align-items-start justify-content-center py-5">
        <div class="container">
            <div class="h-100 row">
                <!-- LEFT PANEL: Form -->
                <div class="col-md-4 d-flex flex-column mb-3">
                    <!-- Title Section -->
                    <div class="bg-dark d-flex align-items-center border-0 mb-3 px-2 py-1 flex-shrink-0">
                        <i class="bi bi-pencil-square fs-4 text-light me-2"></i>
                        <h5 class="mb-0 fw-bold text-light">Crear Nuevo Post</h5>
                    </div>
                    <!-- Content Section -->
                    <div class="flex-grow-1 overflow-auto">
                        <div class="bg-white p-3 card-body d-flex flex-column justify-content-between">
                            <form class="flex-grow-1 d-flex flex-column">
                                <!-- @title -->
                                <div class="mb-3">
                                    <label class="form-label fw-semibold">Título</label>
                                    <input type="text" class="form-control rounded-0" name="title"
                                        placeholder="Ej. Mi nuevo proyecto" required disabled />
                                </div>

                                <!-- @content -->
                                <div class="mb-3 flex-grow-1">
                                    <label class="form-label fw-semibold">Contenido</label>
                                    <textarea class="form-control rounded-0 h-100" rows="5" name="content"
                                        placeholder="¿Qué estás pensando?" required disabled></textarea>
                                </div>

                                <!-- [Action] -->
                                <button type="submit" class="btn btn-outline-dark rounded-0 w-100 fw-bold" disabled>
                                    <i class="bi bi-send-fill me-1"></i> Publicar
                                </button>
                            </form>
                        </div>
                    </div>
                </div>
                <!-- LEFT PANEL: [POSTS] -->
                <div class="col-md-8 d-flex flex-column">
                    <!-- Title Section -->
                    <div class="bg-dark d-flex align-items-center border-0 mb-3 px-2 py-1 flex-shrink-0">
                        <i class="bi bi-collection fs-4 text-light me-2"></i>
                        <h5 class="mb-0 fw-bold text-light">Publicaciones</h5>
                    </div>
                    <!-- Content Section -->
                    <div class="flex-grow-1 overflow-auto">
                        <!-- IF -->
                        <div *ngIf="posts && posts.length > 0; else noPosts">
                            <div class="d-flex flex-column gap-4">
                                <div *ngFor="let post of posts" class="card border-0 rounded-0">
                                    <div class="card-body p-3">
                                        <div class="d-flex justify-content-between align-items-center mb-2">
                                            <span class="text-muted small">
                                                {{ post.createdAt | date:'mediumDate' }}
                                            </span>
                                        </div>
                                        <h5 class="card-title fw-bold mb-2">{{ post.title }}</h5>
                                        <p class="card-text text-muted mb-0">
                                            <span class="text-primary fw-semibold">
                                                {{ post.idUser.username }}:
                                            </span>
                                            {{ post.content }}
                                        </p>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <!-- ELSE -->
                        <ng-template #noPosts>
                            <div class="alert alert-secondary rounded-0 text-center fw-semibold">
                                <i class="bi bi-exclamation-circle me-1"></i> Cargando publicaciones.
                            </div>
                        </ng-template>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- FOOTER -->
    <bottomAppBar [type]="errorMessage ? 'error' : successMessage ? 'success' : null"
        [message]="errorMessage || successMessage" />

</body>
