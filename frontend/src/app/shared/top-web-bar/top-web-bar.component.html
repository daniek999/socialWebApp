<header class="bg-white text-white px-5 d-flex justify-content-between align-items-center border-bottom border-subtle-dark" 
    style="height:70px;">
    <div class="py-2 d-flex align-items-center justify-content-between w-100">
        <!-- Brand -->
        <p class="bodyLarge text-dark text-uppercase m-0">Red Social</p>
        <!-- Actions -->
        <div class="d-flex flex-row align-items-end gap-3">
            <button class="bodyMedium btn btn-outline-danger align-items-center rounded-2" (click)="logout()">
                <i class="bi bi-box-arrow-right me-2"></i> Cerrar Sesión
            </button>
        </div>
    </div>
</header>
