services:
  - type: web
    name: swa-backend
    runtime: node
    branch: main
    region: ohio
    plan: free

    buildCommand: "npm install"
    startCommand: "node src/index.js"

    envVars:
      - key: PORT
        value: 4000

      # === MongoDB ===
      - key: MONGODB_URI
        sync: false

      # === JWT ===
      - key: JWT_SECRET
        sync: false
