services:
  - type: web
    name: swa-backend
    runtime: node
    region: ohio
    plan: free
    branch: main

    rootDir: backend

    buildCommand: "npm install"
    startCommand: "npm start"

    envVars:
      - key: PORT
        value: 4000

      - key: MONGODB_URI
        sync: false

      - key: JWT_SECRET
        sync: false

      - key: EMAIL_USER
        sync: false

      - key: EMAIL_PASS
        sync: false
